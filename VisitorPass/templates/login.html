{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <img src="https://img.icons8.com/color/96/login-rounded.png" alt="Login" class="mb-3">
                        <h3 class="fw-bold">Welcome Back</h3>
                        <p class="text-muted">Sign in to continue to TechCorp VMS</p>
                    </div>
                    
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="bi bi-envelope me-2"></i>Email Address
                            </label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-2"></i>Password
                            </label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                        </button>
                        
                        <div class="text-center">
                            <span class="text-muted">Don't have an account?</span>
                            <a href="{{ url_for('register') }}" class="text-primary fw-semibold ms-1">Register</a>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="alert alert-info">
                        <small>
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>Admin Login:</strong><br>
                            Email: admin@techcorp.com<br>
                            Password: admin123
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
