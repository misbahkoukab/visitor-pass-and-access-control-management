{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">
                <img src="https://img.icons8.com/color/48/bar-chart.png" alt="Analytics" class="me-2">
                Analytics & Reports
            </h2>
            <p class="text-muted">Comprehensive visitor insights and traffic analysis</p>
        </div>
    </div>

    <!-- Daily Visitor Traffic -->
    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-graph-up me-2 text-primary"></i>
                        Daily Visitor Traffic (Last 30 Days)
                    </h5>
                </div>
                <div class="card-body">
                    <canvas id="dailyTrafficChart" height="80"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Zone Traffic -->
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-building me-2 text-primary"></i>
                        Zone Traffic Analysis
                    </h5>
                </div>
                <div class="card-body">
                    <canvas id="zoneTrafficChart" height="150"></canvas>
                </div>
            </div>
        </div>

        <!-- Peak Hours -->
        <div class="col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">
                        <i class="bi bi-clock me-2 text-primary"></i>
                        Peak Visiting Hours
                    </h5>
                </div>
                <div class="card-body">
                    <canvas id="peakHoursChart" height="150"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Export Options -->
    <div class="text-center mt-4">
        <button class="btn btn-primary btn-lg" onclick="exportReport()">
            <i class="bi bi-download me-2"></i> Export Full Report
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    // Daily Traffic Chart
    const dailyData = {{ daily_stats | tojson }};
    const dailyCtx = document.getElementById('dailyTrafficChart').getContext('2d');
    
    new Chart(dailyCtx, {
        type: 'line',
        data: {
            labels: dailyData.map(d => d.date),
            datasets: [{
                label: 'Visitors',
                data: dailyData.map(d => d.count),
                borderColor: '#4e73df',
                backgroundColor: 'rgba(78, 115, 223, 0.1)',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1
                    }
                }
            }
        }
    });

    // Zone Traffic Chart
    const zoneData = {{ zone_traffic | tojson }};
    const zoneCtx = document.getElementById('zoneTrafficChart').getContext('2d');
    
    new Chart(zoneCtx, {
        type: 'bar',
        data: {
            labels: Object.keys(zoneData),
            datasets: [{
                label: 'Access Count',
                data: Object.values(zoneData),
                backgroundColor: '#1cc88a'
            }]
        },
        options: {
            responsive: true,
            indexAxis: 'y',
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });

    // Peak Hours Chart
    const hourData = {{ hour_traffic | tojson }};
    const hourCtx = document.getElementById('peakHoursChart').getContext('2d');
    
    new Chart(hourCtx, {
        type: 'bar',
        data: {
            labels: Object.keys(hourData).map(h => h + ':00'),
            datasets: [{
                label: 'Visitors',
                data: Object.values(hourData),
                backgroundColor: '#f6c23e'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: false
                }
            }
        }
    });

    function exportReport() {
        alert('Export functionality will generate a comprehensive PDF report');
    }
</script>
{% endblock %}
