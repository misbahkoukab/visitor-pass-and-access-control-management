{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square me-2"></i>
                        Edit Visitor Zone Access
                    </h4>
                </div>
                <div class="card-body p-4">
                    <!-- Visitor Info -->
                    <div class="alert alert-info">
                        <h5 class="alert-heading">
                            <i class="bi bi-person-badge me-2"></i>
                            {{ visitor.title }} {{ visitor.full_name }}
                        </h5>
                        <hr>
                        <p class="mb-0"><strong>Visitor ID:</strong> {{ visitor.visitor_id }}</p>
                        <p class="mb-0"><strong>Purpose:</strong> {{ visitor.purpose }}</p>
                    </div>

                    <form method="POST">
                        <h5 class="mb-3">
                            <i class="bi bi-building-check me-2"></i>
                            Authorized Zones
                        </h5>
                        
                        <div class="row g-2">
                            {% for zone in all_zones %}
                            <div class="col-md-4">
                                <div class="form-check zone-checkbox">
                                    <input class="form-check-input" type="checkbox" name="authorized_zones" 
                                           value="{{ zone }}" id="zone_{{ loop.index }}"
                                           {% if zone in visitor.authorized_zones %}checked{% endif %}>
                                    <label class="form-check-label" for="zone_{{ loop.index }}">
                                        {{ zone }}
                                    </label>
                                </div>
                            </div>
                            {% endfor %}
                        </div>

                        <hr class="my-4">

                        <div class="d-flex gap-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle me-2"></i> Update Zones
                            </button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-x-circle me-2"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
