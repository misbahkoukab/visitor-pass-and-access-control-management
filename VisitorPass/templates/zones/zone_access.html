{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row mb-4">
        <div class="col">
            <h2 class="fw-bold">
                <img src="https://img.icons8.com/color/48/door-opened.png" alt="Zones" class="me-2">
                Zone Access Control
            </h2>
            <p class="text-muted">Select a zone to scan visitor QR code</p>
        </div>
    </div>

    <!-- Zone Cards Grid -->
    <div class="row g-4">
        {% for zone in zones %}
        <div class="col-lg-3 col-md-4 col-sm-6">
            <a href="{{ url_for('scan_zone', zone_name=zone) }}" class="text-decoration-none">
                <div class="zone-access-card">
                    <div class="zone-icon-large">
                        <img src="https://img.icons8.com/fluency/96/room.png" alt="{{ zone }}">
                    </div>
                    <h5 class="zone-name mt-3">{{ zone }}</h5>
                    <p class="text-muted small">Click to scan access</p>
                    <div class="zone-indicator">
                        <i class="bi bi-qr-code-scan"></i>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
